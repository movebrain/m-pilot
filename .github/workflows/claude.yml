name: Claude

# PR 코멘트에 `@claude`를 쓰면 코드 수정, 커밋 push, PR 본문·제목 수정, 질문 답변을 맡긴다.
# 브랜치 필터는 없어 develop, main 어느 쪽을 base로 한 PR에서도 호출된다. 다만 이벤트마다 읽는 파일이 다르다.
# - issue_comment(PR 대화 코멘트): 기본 브랜치(main)의 이 파일. main에 들어간 뒤부터 동작한다.
# - pull_request_review_comment(코드 줄 코멘트): PR 머지 결과의 이 파일. develop에 들어가면 develop 대상 PR부터 동작한다.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# 같은 PR에서 요청이 겹치면 순서대로 처리한다(앞 작업을 취소하지 않는다).
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  claude:
    # 저장소 구성원만 호출할 수 있다. PR 코멘트만 받고(이슈 제외), 봇 코멘트는 무시한다.
    if: >-
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # shortcut: DB 없이 도는 러너라 pytest는 열지 않는다. 테스트는 push 후 CI 결과(actions: read)로 확인한다.
          claude_args: >-
            --model claude-sonnet-5-5
            --effort high
            --max-turns 50
            --allowedTools "Bash(git --no-pager diff:*),Bash(git --no-pager log:*),Bash(git --no-pager show:*),Bash(git --no-pager blame:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr edit:*),Bash(gh pr comment:*)"
            --append-system-prompt "저장소의 CLAUDE.md와 .claude/skills의 규칙을 따른다(커밋 형식, 본문 형식, Claude 서명·Co-authored-by 금지). main·develop에는 push하지 않고 force push도 하지 않는다. 코멘트와 PR 본문은 한국어로 쓴다. PR 본문을 고칠 때는 create-pr 스킬의 형식(## 변경 사항, ## 머지 커밋 메시지)을 유지한다."
