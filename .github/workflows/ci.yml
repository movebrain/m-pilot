name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # 합본 매뉴얼 PDF를 읽는 파서 테스트가 길다(약 10분)
    services:
      # 시연용 DB와 분리된 테스트 DB. 러너가 헬스체크 통과를 기다리고 job이 끝나면 정리한다.
      # shortcut: 서비스 컨테이너는 실행 인자를 못 줘 서버 콜레이션이 MySQL 기본값(utf8mb4_0900_ai_ci)이다.
      #   docker-compose.yml(utf8mb4_unicode_ci)과 다르므로 콜레이션에 의존하는 테스트가 생기면 스키마에 명시한다.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mpilot
          MYSQL_DATABASE: mpilot_test
          MYSQL_USER: mpilot
          MYSQL_PASSWORD: mpilot
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      # .env.example과 같은 변수 이름
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: mpilot
      MYSQL_PASSWORD: mpilot
      MYSQL_DATABASE: mpilot_test
      MYSQL_TEST_DATABASE: mpilot_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 합본 매뉴얼 PDF 읽기 결과(tests/conftest.py의 디스크 캐시). PDF·parser.py·의존성이 바뀌면 키가 달라져 새로 읽는다.
      # PR 브랜치에서 만든 캐시는 그 PR만 쓰고, develop에서 만든 캐시는 모든 PR이 쓴다.
      - name: 파싱 캐시 복원
        uses: actions/cache@v4
        with:
          path: .pytest_parse_cache
          key: parse-${{ hashFiles('data/manuals/*.pdf', 'mpilot/db/parser.py', 'tests/conftest.py', 'requirements.txt') }}

      - name: 테스트 실행
        run: python -m pytest
